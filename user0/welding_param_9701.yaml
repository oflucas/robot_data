description: |
  Cart-driven straight line weld on both sides at once (work95 left + right). Robot must be
  connected as a robot_team of [cart, weld_robot1, weld_robot2], e.g. ['robot17', 'robot15', 'robot16']
  (see build_line_cart_coordinator in line_cart_coordinator.py).
  Merged from welding_param_95.yaml (left outer side, front robot robot15) and
  welding_param_9501.yaml (left inner side, back robot robot16).
  Top-level params are shared by both robots; robot_param[i] overrides them for the i-th welding
  robot in the team (cart excluded), e.g. is_left_side, align_rt, actions_offset; its real_period_list
  fills actions_param.swing_list[k].real_period.
  备注: 用于焊接小车右侧的双侧加强板
  robot运动和小车运动不同时结束解决, 固定好焊接速度(行走速度)和摆动参数, 走一遍计时实际摆动周期T设置为real_period.
  然后再观察运动,如果小车先于摆动停止, 那么应该减少总摆动次数, 微调加大T, 反之减少T.
weld_length: 350.0
safe_height: 30.0
weld_speed: 4.0
time_to_weld_at_end: 1.5 # s, hold the arc at the end of the weld trajectory.
welding_config:
  mode: io # Manual set 123A 18V, pulse mode.
tolerance_factor_to_scan_step: 2.0
lose_track_step_threshold: 5
actions:
  - [0.0, 0.0, 42] #1
  - [6.0, 0.0, 42] #2
  - [0.0, 7.0, 42] #3
actions_param:
  swing_list:
    - period: 1.3 #1
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
    - period: 1.3 #2
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
    - period: 1.3 #3
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
robot_param:
  - # 机器人1: front robot (robot15), right outer side.
    is_left_side: False
    align_rt: [-334, -917, -202, -0.8927359124, 0.0101578162, -3.0756017546]
    real_period_list: [2.6, 2.6, 2.6] # One per action layer.
    actions_offset: [0, 0] # [offset_z, offset_y] added to every action layer of this robot.
  - # 机器人2: back robot (robot16), right inner side.
    is_left_side: True
    align_rt: [456, -711, -261.4, -0.819659, -0.026843, -0.018972]
    real_period_list: [2.6, 2.6, 2.6] # One per action layer.
    actions_offset: [0, 0] # [offset_z, offset_y] added to every action layer of this robot.
executor_type: double-line-cart

# Toggle side sequence (HMI "切换侧"): moves the two welding robots one move at a time, in order.
# Choosing right runs it forward (left side -> right side); choosing left runs it reversed (right -> left).
# So each robot's FIRST move should be its left-side work pose and its LAST move its right-side work pose.
# robot: 1-based welding robot index in the team (cart excluded). Move format is the same as fetch_sequence.
# TODO: dummy values, replace with real poses.
work_side: right
toggle_side_moves:
  - robot: 2 # Robot 2 start position
    type: "linear"
    position: [393.192, 708.386, -164.019, -43.549, -0.561, 179.538]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  - robot: 2 # Robot 2 more backwards
    type: "linear"
    position: [347.913, 654.565, -164.056, -43.547, -0.564, 179.532]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  - robot: 2 # rotate end tool 90
    type: "joint"
    angles: [-285.471, 27.995, -109.069, -1.143, -43.761, -16.846]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # rotate end tool 180
    type: "joint"
    angles: [-285.471, 27.995, -109.07, -1.141, -43.761, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # fold end tool
    type: "joint"
    angles: [-285.471, 27.999, -109.078, -10.296, -141, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # flip joint 1,2
    type: "joint"
    angles: [-252.063, -25.741, -109.055, -10.301, -141, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # flip joint 3 half way
    type: "joint"
    angles: [-252.063, -25.728, -162.655, -10.293, -141, 77.647]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # rotate joint 4 to avoid collision
    type: "joint"
    angles: [-252.063, -25.727, -162.66, 29.706, -140.678, 77.649]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # flip joint 3 complete
    type: "joint"
    angles: [-252.063, -25.683, -251.816, 29.721, -140.648, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2 # unfold tool partly
    type: "joint"
    angles: [-252.063, -25.679, -251.824, 29.718, -53.405, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2  # unfold tool fully
    type: "joint"
    angles: [-252.063, -25.684, -251.817, 29.723, 33.512, 77.648]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2  # make tool orientation good at right
    type: "joint"
    angles: [-251.77, -34.156, -280.774, 2.606, 67.056, 109.851]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 2  # make room for robot 1
    type: "linear"
    position: [170.062, -823.449, -21.837, -43.367, -3.195, 0.158]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  - robot: 1 ################## robot 1 start position
    type: "linear"
    position: [-333.927, 868.426, -94.625, -49.005, -1.354, 6.377]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  - robot: 1 # start position in angle (reverse needs it)
    type: "joint"
    angles: [-78.635, -39.344, -281.435, 0.058, 63, -85.688]  # Joint angles in degrees
  - robot: 1 # fold tool
    type: "joint"
    angles: [-78.635, -39.344, -281.435, 0.058, 146.153, -85.688]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # flip joint 3 half way
    type: "joint"
    angles: [-78.635, -39.394, -179.239, 0.031, 146.118, -85.688]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # flip joint 3 full
    type: "joint"
    angles: [-78.635, -39.394, -85.224, 0.031, 146.094, -85.687]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # flip joint 1,2
    type: "joint"
    angles: [-86.221, 33.77, -85.212, 0.029, 146.11, -85.687]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # unfold tool half and rotate joint 6 90
    type: "joint"
    angles: [-86.221, 33.764, -85.204, 0.029, 31.019, 4.376]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # fully flipped
    type: "joint"
    angles: [-86.221, 33.769, -85.213, 0.03, -58.909, 95.407]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1 # go to ready align position
    type: "linear"
    position: [-251.861, -983.222, -134.976, -49.635, -1.073, -179.024] # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  - robot: 2  # make room for robot 1 (reverse move needs it)
    type: "linear"
    speed: 100 # mm/s
    position: [170.062, -823.449, -21.837, -43.367, -3.195, 0.158]  # [x,y,z,rx,ry,rz] in mm/degrees
  - robot: 2 ######### go to ready align position
    type: "linear"
    position: [527.154, -666.855, -215.782, -43.366, -3.193, 0.158] # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s