description: |
  Cart-driven straight line weld on both sides at once (work95 left + right). Robot must be
  connected as a robot_team of [cart, weld_robot1, weld_robot2], e.g. ['robot17', 'robot15', 'robot16']
  (see build_line_cart_coordinator in line_cart_coordinator.py).
  Merged from welding_param_95.yaml (left outer side, front robot robot15) and
  welding_param_9501.yaml (left inner side, back robot robot16).
  Top-level params are shared by both robots; robot_param[i] overrides them for the i-th welding
  robot in the team (cart excluded), e.g. is_left_side, align_rt, actions_offset; its real_period_list
  fills actions_param.swing_list[k].real_period.
  备注: 用于焊接小车左侧的双侧加强板
  robot运动和小车运动不同时结束解决, 固定好焊接速度(行走速度)和摆动参数, 走一遍计时实际摆动周期T设置为real_period.
  然后再观察运动,如果小车先于摆动停止, 那么应该减少总摆动次数, 微调加大T, 反之减少T.
weld_length: 160.0
safe_height: 30.0
weld_speed: 4.0
welding_config:
  mode: io # Manual set 272A 24.8V, unified.
tolerance_factor_to_scan_step: 2.0
lose_track_step_threshold: 5
actions:
  - [0.0, 0.0, 42] #1
  - [6.0, 0.0, 42] #2
  - [0.0, 7.0, 42] #3
actions_param:
  swing_list:
    - period: 1.3 #1
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
    - period: 1.3 #2
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
    - period: 1.3 #3
      hold_times: [0., 0.]
      first_stroke_rel_offset: [4, 0]
      second_stroke_rel_offset: [0, 4]
robot_param:
  - # 机器人1: front robot (robot15), left outer side.
    is_left_side: True
    align_rt: [-333.94503654678806, 868.4950512148957, -194.57761035674213, -0.8552087278392972, -0.02362365647414988, 0.11131352219862145]
    real_period_list: [2.6, 2.6, 2.6] # One per action layer.
    # The pin should be calibrated at 20mm, but it is cali.ed at 15mm, then here we need to compensate [3.6, 3.6]
    actions_offset: [2.6, 5.6] # [out, height] added to every action layer of this robot.
  - # 机器人2: back robot (robot16), left inner side.
    is_left_side: False
    align_rt: [393.2, 708.41, -264, -0.760091, -0.009774, 3.133564]
    real_period_list: [2.6, 2.6, 2.6] # One per action layer.
    actions_offset: [-2, 2] # [out, height] added to every action layer of this robot.
executor_type: double-line-cart

# Toggle side sequence (HMI "切换侧"): moves the two welding robots one move at a time, in order.
# Choosing right runs it forward (left side -> right side); choosing left runs it reversed (right -> left).
# So each robot's FIRST move should be its left-side work pose and its LAST move its right-side work pose.
# robot: 1-based welding robot index in the team (cart excluded). Move format is the same as fetch_sequence.
# TODO: dummy values, replace with real poses.
work_side: left
toggle_side_moves:
  # Robot 1 raises up from left-side work pose
  - robot: 1
    type: "linear"
    position: [385.1, -408, 759, 179.7, -0.9, 45.3]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  # Robot 2 raises up from left-side work pose
  - robot: 2
    type: "linear"
    position: [385.1, -408, 759, 179.7, -0.9, 45.3]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  # Robot 1 swings over to the right side
  - robot: 1
    type: "joint"
    angles: [-15, 4.1, -69, 182, 84, 274]  # Joint angles in degrees
    speed: 20 # degree/s
  - robot: 1
    type: "joint"
    angles: [-71, -23, 11.6, 179.66, -145.5, 243]  # Joint angles in degrees
    speed: 20 # degree/s
  # Robot 2 swings over to the right side
  - robot: 2
    type: "joint"
    angles: [-33, 19, -54, 181, 107, 282]  # Joint angles in degrees
    speed: 20 # degree/s
  # Robot 1 drops down to right-side work pose
  - robot: 1
    type: "linear"
    position: [-256.6, 323.5, 867.5, 179.7, -0.1, 45.5]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
  # Robot 2 drops down to right-side work pose
  - robot: 2
    type: "linear"
    position: [-256.6, 323.5, 867.5, 179.7, -0.1, 45.5]  # [x,y,z,rx,ry,rz] in mm/degrees
    speed: 100 # mm/s
